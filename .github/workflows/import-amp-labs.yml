name: Import AMP lab projects
on: workflow_dispatch
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit the lab folders
        shell: bash
        run: |
          temp_dir=$(mktemp -d)
          unzip -q AMP_Flutter_Labs.zip -d "$temp_dir"
          for lab in "$temp_dir"/amp-labs/lab-*; do
            test ! -e "$(basename "$lab")"
          done
          test ! -e README.md
          cp -R "$temp_dir"/amp-labs/. .
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md lab-*
          git commit -m 'Publish ten Flutter lab project folders'
          git push origin HEAD:main
